name: Send Price Alert Emails

on:
  schedule:
    # Daily at 07:00 UTC — after all scrapers have finished:
    #   eBay      03:00 UTC  (daily)
    #   Amazon    04:00 UTC  (daily)
    #   MM        04:00 UTC  (daily)
    #   AZ stock  05:00 UTC  (Monday)
    #   NK import 05:30 UTC  (Monday)
    #   --> alerts 07:00 UTC  (daily) <-- all prices are fresh
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions tab (great for testing)
    inputs:
      dry_run:
        description: 'Dry run (log recipients, send nothing)'
        type: boolean
        default: false

jobs:
  send-alerts:
    name: Price Alert Emails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations (ensures last_alerted_at column exists)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py migrate --run-syncdb

      - name: Send price alert emails
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python manage.py send_price_alerts $FLAGS
