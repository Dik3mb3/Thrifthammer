name: Update eBay Prices

on:
  schedule:
    # All times UTC. The catalogue is split into 2 slices by product id (see the
    # "Pick catalogue slice" step below). Each slice runs every 6 hours, so every
    # product is still refreshed 4x/day, but each run covers about half the
    # products and finishes well inside the 135-minute timeout. A full pass used
    # to run past the timeout and get cancelled, leaving the tail of the
    # catalogue (alphabetically late gw_sku) un-refreshed. The eBay UK workflow
    # runs 90 minutes after these. Every cron line below MUST be mapped in the
    # slice step; products/test_ebay_sharding.py checks that.
    - cron: '10 0,6,12,18 * * *'   # slice 1/2 (also runs the books step)
    - cron: '10 3,9,15,21 * * *'   # slice 2/2
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Dry run (no DB changes)'
        type: boolean
        default: false
      limit:
        description: 'Max products to process (leave blank for all)'
        type: string
        default: ''
      batch_tag:
        description: 'Only process products with this batch_tag (e.g. blood-bowl, phase-2)'
        type: string
        default: ''
      skus:
        description: 'Comma-separated GW SKUs to update (e.g. "55-23,TY-011,53-21"). Leave blank for all.'
        type: string
        default: ''
      category:
        description: 'Category alias: Warhammer-40K, AoS, Old-World, Paint-Supplies, Kill-Team, or Horus-Heresy. (Other categories already have a clean 1:1 batch_tag above -- use that instead.) Leave blank for all.'
        type: string
        default: ''
      shard:
        description: 'Only one slice of the catalogue, as K/N split by product id (e.g. 1/2 = first half, 2/2 = second half). Leave blank for all.'
        type: string
        default: ''
      book_dry_run:
        description: '[Books step] Dry run (no DB changes)'
        type: boolean
        default: false
      book_faction:
        description: '[Books step] Only update this faction (e.g. "Horus Heresy Series"), leave blank for all'
        type: string
        default: ''
      book_category:
        description: '[Books step] Only update this category (e.g. "Warhammer"), leave blank for all'
        type: string
        default: ''
      book_skus:
        description: '[Books step] Comma-separated GW SKUs to update. Leave blank for all.'
        type: string
        default: ''
      book_limit:
        description: '[Books step] Max format rows to process (leave blank for all)'
        type: string
        default: ''

jobs:
  update-prices:
    name: eBay Price Update
    runs-on: ubuntu-latest
    timeout-minutes: 135
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick catalogue slice
        id: slice
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SHARD: ${{ github.event.inputs.shard }}
        run: |
          # Scheduled runs: each cron line covers one slice of the catalogue
          # (K/N = slice K of N, split by product id inside the database, so new
          # products are picked up automatically). Slice 1 also runs the books
          # step. Manual runs: blank = everything, or the shard input as typed.
          SHARD=""
          RUN_BOOKS="true"
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '10 0,6,12,18 * * *') SHARD="1/2" ;;
              '10 3,9,15,21 * * *') SHARD="2/2" ;;
              *) echo "No catalogue slice is mapped to schedule '$SCHEDULE'."; exit 1 ;;
            esac
            if [ "$SHARD" != "1/2" ]; then
              RUN_BOOKS="false"
            fi
          else
            SHARD="$INPUT_SHARD"
          fi
          echo "Catalogue slice: ${SHARD:-all products} (books step: $RUN_BOOKS)"
          echo "shard=$SHARD" >> "$GITHUB_OUTPUT"
          echo "run_books=$RUN_BOOKS" >> "$GITHUB_OUTPUT"

      - name: Run eBay price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
          EBAY_APP_ID_PRODUCTION: ${{ secrets.EBAY_APP_ID_PRODUCTION }}
          EBAY_CERT_ID_PRODUCTION: ${{ secrets.EBAY_CERT_ID_PRODUCTION }}
          EBAY_AFFILIATE_CAMPAIGN_ID: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN_ID }}
          SHARD: ${{ steps.slice.outputs.shard }}
        run: |
          # Array (not a plain string) so values with spaces/commas -- e.g.
          # category names like "Warhammer 40,000" or "Paint & Supplies" --
          # survive as a single argument instead of being word-split.
          FLAGS=()
          if [ -n "$SHARD" ]; then
            FLAGS+=(--shard "$SHARD")
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS+=(--limit "${{ github.event.inputs.limit }}")
          fi
          if [ -n "${{ github.event.inputs.batch_tag }}" ]; then
            FLAGS+=(--batch-tag "${{ github.event.inputs.batch_tag }}")
          fi
          if [ -n "${{ github.event.inputs.skus }}" ]; then
            FLAGS+=(--skus "${{ github.event.inputs.skus }}")
          fi
          if [ -n "${{ github.event.inputs.category }}" ]; then
            # Short aliases for the categories with no single clean batch_tag
            # (everything else already has one -- use batch_tag for those).
            case "${{ github.event.inputs.category }}" in
              Warhammer-40K)   CATEGORY_NAME="Warhammer 40,000" ;;
              AoS)             CATEGORY_NAME="Age of Sigmar" ;;
              Old-World)       CATEGORY_NAME="The Old World" ;;
              Paint-Supplies)  CATEGORY_NAME="Paint & Supplies" ;;
              Kill-Team)       CATEGORY_NAME="Kill Team" ;;
              Horus-Heresy)    CATEGORY_NAME="Horus Heresy" ;;
              *)
                echo "Unknown category alias: '${{ github.event.inputs.category }}'. Valid aliases: Warhammer-40K, AoS, Old-World, Paint-Supplies, Kill-Team, Horus-Heresy."
                exit 1
                ;;
            esac
            FLAGS+=(--category "$CATEGORY_NAME")
          fi
          python manage.py update_ebay_prices "${FLAGS[@]}"

      - name: Run eBay book price update
        if: steps.slice.outputs.run_books == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
          EBAY_APP_ID_PRODUCTION: ${{ secrets.EBAY_APP_ID_PRODUCTION }}
          EBAY_CERT_ID_PRODUCTION: ${{ secrets.EBAY_CERT_ID_PRODUCTION }}
          EBAY_AFFILIATE_CAMPAIGN_ID: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN_ID }}
        run: |
          FLAGS=()
          if [ "${{ github.event.inputs.book_dry_run }}" = "true" ]; then
            FLAGS+=(--dry-run)
          fi
          if [ -n "${{ github.event.inputs.book_faction }}" ]; then
            FLAGS+=(--faction "${{ github.event.inputs.book_faction }}")
          fi
          if [ -n "${{ github.event.inputs.book_category }}" ]; then
            FLAGS+=(--category "${{ github.event.inputs.book_category }}")
          fi
          if [ -n "${{ github.event.inputs.book_skus }}" ]; then
            FLAGS+=(--skus "${{ github.event.inputs.book_skus }}")
          fi
          if [ -n "${{ github.event.inputs.book_limit }}" ]; then
            FLAGS+=(--limit "${{ github.event.inputs.book_limit }}")
          fi
          python manage.py update_ebay_book_prices "${FLAGS[@]}"

      - name: Clear cache after price update
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
