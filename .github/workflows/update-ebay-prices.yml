name: Update eBay Prices

on:
  schedule:
    # Daily at 03:00 UTC (matches Railway cron as backup)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab
    inputs:
      dry_run:
        description: 'Dry run (no DB changes)'
        type: boolean
        default: false
      limit:
        description: 'Max products to process (leave blank for all)'
        type: string
        default: ''
      batch_tag:
        description: 'Only process products with this batch_tag (e.g. blood-bowl, phase-2)'
        type: string
        default: ''
      skus:
        description: 'Comma-separated GW SKUs to update (e.g. "55-23,TY-011,53-21"). Leave blank for all.'
        type: string
        default: ''

jobs:
  update-prices:
    name: eBay Price Update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eBay price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
          EBAY_APP_ID_PRODUCTION: ${{ secrets.EBAY_APP_ID_PRODUCTION }}
          EBAY_CERT_ID_PRODUCTION: ${{ secrets.EBAY_CERT_ID_PRODUCTION }}
          EBAY_AFFILIATE_CAMPAIGN_ID: ${{ secrets.EBAY_AFFILIATE_CAMPAIGN_ID }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.batch_tag }}" ]; then
            FLAGS="$FLAGS --batch-tag ${{ github.event.inputs.batch_tag }}"
          fi
          if [ -n "${{ github.event.inputs.skus }}" ]; then
            FLAGS="$FLAGS --skus ${{ github.event.inputs.skus }}"
          fi
          python manage.py update_ebay_prices $FLAGS

      - name: Clear cache after price update
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
