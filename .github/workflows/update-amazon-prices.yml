name: Update Amazon Prices (Creators API)

on:
  schedule:
    # All times EDT (UTC-4). Adjust +1hr in winter when EST (UTC-5) kicks in.
    - cron: '0 9 * * *'   #  5:00 AM EDT
    - cron: '0 14 * * *'  # 10:00 AM EDT
    - cron: '0 19 * * *'  #  3:00 PM EDT
    - cron: '0 0 * * *'   #  8:00 PM EDT
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB changes)'
        type: boolean
        default: false
      limit:
        description: 'Max ASINs to process (leave blank for all)'
        type: string
        default: ''
      sku:
        description: 'Single SKU to update (e.g. AS-001, leave blank for all)'
        type: string
        default: ''
      batch_tag:
        description: 'Only process products with this batch_tag (e.g. skaven, stormcast)'
        type: string
        default: ''

jobs:
  update-prices:
    name: Amazon Price Update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Amazon price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_ASSOCIATE_TAG: thrifthammer7-20
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.sku }}" ]; then
            FLAGS="$FLAGS --sku ${{ github.event.inputs.sku }}"
          elif [ -n "${{ github.event.inputs.batch_tag }}" ]; then
            FLAGS="$FLAGS --batch-tag ${{ github.event.inputs.batch_tag }}"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          python manage.py update_amazon_creators_prices $FLAGS

      - name: Clear cache after price update
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
        run: python manage.py clear_cache
