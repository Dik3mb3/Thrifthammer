name: Check Amazon Stock

# ─────────────────────────────────────────────────────────────────────────────
# Manual-only workflow. Amazon blocks automated requests from GitHub Actions
# IPs regardless of TLS fingerprinting. Use scrape_amazon_browser.py locally
# instead (residential IP + real Chrome). This workflow is kept as a manual
# fallback to test whether Amazon blocking has changed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

jobs:
  check-stock:
    name: Amazon Stock Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Amazon scraper
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY:    ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG:         'False'
          RAILWAY_ENVIRONMENT:  production
        run: python manage.py run_scrapers amazon

      - name: Clear cache
        env:
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY:    ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG:         'False'
          RAILWAY_ENVIRONMENT:  production
        run: python manage.py clear_cache
