name: Seed Faction Stat Data (Production)

# Run manually from GitHub Actions UI to populate unit stats,
# weapon profiles, and abilities into the Railway PostgreSQL database.
# Safe to re-run — all seed commands use update_or_create.

on:
  workflow_dispatch:
    inputs:
      factions:
        description: 'Which factions to seed (comma-separated: votann,admech,aeldari,guard,chaos_space_marines,custodes,death_guard,thousand_sons,world_eaters,emperors_children,drukhari,grey_knights,necrons,orks,sisters_of_battle,tau_empire,tyranids,genestealer_cults,imperial_knights,imperial_fists,space_marines,blood_angels,space_wolves,dark_angels,deathwatch — or "all"). Maintenance: delete_codex_units, delete_legacy_guard_units, assign_missing_skus, sync_cross_faction_units'
        type: string
        default: 'all'
      dry_run:
        description: 'Dry run (preview changes, write nothing)'
        type: boolean
        default: false

jobs:
  seed:
    name: Seed faction data into production DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed faction data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: |
          # ---------------------------------------------------------------
          # INPUT SLUG → EXACT DB FACTION NAME MAPPING
          # The --faction arg must match Faction.name exactly in the DB.
          # Run locally to verify: python manage.py shell -c
          #   "from calculators.models import Faction; [print(repr(f.name)) for f in Faction.objects.order_by('name')]"
          #
          #   Input slug          DB faction name
          #   votann              Leagues of Votann
          #   admech              Adeptus Mechanicus
          #   aeldari             Aeldari
          #   guard               Astra Militarum
          #   custodes            Custodes
          #   drukhari            Drukhari
          #   grey_knights        Grey Knights
          #   necrons             Necrons
          #   orks                Orks
          #   sisters_of_battle   Sisters of Battle
          #   tau_empire          T'au Empire          ← apostrophe, exact
          #   tyranids            Tyranids
          #   genestealer_cults   Genestealer Cults
          #   imperial_knights    Imperial Knights
          #   blood_angels        Blood Angels
          #   space_wolves        Space Wolves
          #   dark_angels         Dark Angels
          #   deathwatch          Deathwatch
          #   chaos_space_marines Chaos Space Marines
          #   death_guard         Death Guard
          #   thousand_sons       Thousand Sons
          #   world_eaters        World Eaters
          #   emperors_children   Emperor's Children   ← apostrophe in DB name, exact
          #   chaos_knights       Chaos Knights
          #   space_marines       Space Marines
          #   black_templars      Black Templars
          #   ultramarines        Ultramarines
          #   imperial_fists      Imperial Fists
          #   iron_hands          Iron Hands
          #   salamanders         Salamanders
          #   raven_guard         Raven Guard
          #   white_scars         White Scars
          # ---------------------------------------------------------------
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi

          FACTIONS="${{ github.event.inputs.factions }}"

          run_seed() {
            echo "========================================="
            echo "Running: $1"
            echo "========================================="
            python manage.py $1 $FLAGS
          }

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "votann"; then
            run_seed seed_votann_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Leagues of Votann"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Leagues of Votann" \
              --json ../parser_output/votann_parsed.json \
              --mapping ../parser_output/votann_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "admech"; then
            run_seed seed_admech_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Adeptus Mechanicus"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Adeptus Mechanicus" \
              --json ../parser_output/admech_parsed.json \
              --mapping ../parser_output/admech_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "aeldari"; then
            run_seed seed_aeldari_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Aeldari"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Aeldari" \
              --json ../parser_output/aeldari_parsed.json \
              --mapping ../parser_output/aeldari_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "guard"; then
            run_seed seed_guard_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Astra Militarum"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Astra Militarum" \
              --json ../parser_output/guard_parsed.json \
              --mapping ../parser_output/guard_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "custodes"; then
            run_seed seed_custodes_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Custodes"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Custodes" \
              --json ../parser_output/custodes_parsed.json \
              --mapping ../parser_output/custodes_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "drukhari"; then
            run_seed seed_drukhari_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Drukhari"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Drukhari" \
              --json ../parser_output/drukhari_parsed.json \
              --mapping ../parser_output/drukhari_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "grey_knights"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Grey Knights"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Grey Knights" $FLAGS
            run_seed seed_grey_knights_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Grey Knights"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Grey Knights" \
              --json ../parser_output/grey_knights_parsed.json \
              --mapping ../parser_output/grey_knights_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "necrons"; then
            run_seed seed_necrons_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Necrons"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Necrons" \
              --json ../parser_output/necrons_parsed.json \
              --mapping ../parser_output/necrons_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "orks"; then
            run_seed seed_orks_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Orks"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Orks" \
              --json ../parser_output/orks_parsed.json \
              --mapping ../parser_output/orks_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "sisters_of_battle"; then
            run_seed seed_sisters_of_battle_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Sisters of Battle"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Sisters of Battle" \
              --json ../parser_output/sisters_of_battle_parsed.json \
              --mapping ../parser_output/sisters_of_battle_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "tau_empire"; then
            run_seed seed_tau_stats
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction T'au Empire"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "T'au Empire" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction T'au Empire"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "T'au Empire" \
              --json ../parser_output/tau_parsed.json \
              --mapping ../parser_output/tau_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "genestealer_cults"; then
            run_seed seed_genestealer_cults_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Genestealer Cults"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Genestealer Cults" \
              --json ../parser_output/genestealer_cults_parsed.json \
              --mapping ../parser_output/genestealer_cults_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "imperial_knights"; then
            run_seed seed_imperial_knights_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Imperial Knights"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Imperial Knights" \
              --json ../parser_output/knights_parsed.json \
              --mapping ../parser_output/knights_mapping.csv \
              $FLAGS
          fi

          # space_marines uses comma-wrapping to avoid matching chaos_space_marines
          if [ "$FACTIONS" = "all" ] || echo ",$FACTIONS," | grep -q ",space_marines,"; then
            echo "========================================="
            echo "Running: import_faction_stats --faction Space Marines"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Space Marines" \
              --json ../parser_output/spacemarines_parsed.json \
              --mapping ../parser_output/spacemarines_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "blood_angels"; then
            run_seed seed_blood_angels_stats
            echo "========================================="
            echo "Running: import_faction_stats --faction Blood Angels"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Blood Angels" \
              --json ../parser_output/blood_angels_parsed.json \
              --mapping ../parser_output/blood_angels_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "space_wolves"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Space Wolves"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Space Wolves" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Space Wolves"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Space Wolves" \
              --json ../parser_output/spacewolves_parsed.json \
              --mapping ../parser_output/spacewolves_mapping.csv \
              $FLAGS
          fi
          
          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "dark_angels"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Dark Angels"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Dark Angels" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Dark Angels"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Dark Angels" \
              --json ../parser_output/dark_angels_parsed.json \
              --mapping ../parser_output/dark_angels_mapping.csv \
              $FLAGS
          fi

           
          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "imperial_fists"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Imperial Fists"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Imperial Fists" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Imperial Fists"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Imperial Fists" \
              --json ../parser_output/imperial_fists_parsed.json \
              --mapping ../parser_output/imperial_fists_mapping.csv \
              $FLAGS
          fi

           if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "raven_guard"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Raven Guard"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Raven Guard" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Raven Guard"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Raven Guard" \
              --json ../parser_output/raven_guard_parsed.json \
              --mapping ../parser_output/raven_guard_mapping.csv \
              $FLAGS
          fi

             if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "iron_hands"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Iron Hands"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Iron Hands" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Iron Hands"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Iron Hands" \
              --json ../parser_output/iron_hands_parsed.json \
              --mapping ../parser_output/iron_hands_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "deathwatch"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Deathwatch"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Deathwatch" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Deathwatch"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Deathwatch" \
              --json ../parser_output/deathwatch_parsed.json \
              --mapping ../parser_output/deathwatch_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "tyranids"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Tyranids"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Tyranids" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Tyranids"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Tyranids" \
              --json ../parser_output/tyranids_parsed.json \
              --mapping ../parser_output/tyranids_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "chaos_space_marines"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Chaos Space Marines"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Chaos Space Marines" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Chaos Space Marines"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Chaos Space Marines" \
              --json ../parser_output/chaos_space_marine_parsed.json \
              --mapping ../parser_output/chaos_space_marine_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "death_guard"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Death Guard"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Death Guard" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Death Guard"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Death Guard" \
              --json ../parser_output/death_guard_parsed.json \
              --mapping ../parser_output/death_guard_mapping.csv \
              $FLAGS
          fi
          
           if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "thousand_sons"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Thousand Sons"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Thousand Sons" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Thousand Sons"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Thousand Sons" \
              --json ../parser_output/thousand_sons_parsed.json \
              --mapping ../parser_output/thousand_sons_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "world_eaters"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction World Eaters"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "World Eaters" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction World Eaters"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "World Eaters" \
              --json ../parser_output/worldeaters_parsed.json \
              --mapping ../parser_output/worldeaters_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "emperors_children"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Emperor's Children"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Emperor's Children" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Emperor's Children"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Emperor's Children" \
              --json ../parser_output/ec_parsed.json \
              --mapping ../parser_output/ec_mapping.csv \
              $FLAGS
          fi

          if echo "$FACTIONS" | grep -q "sync_cross_faction_units"; then
            run_seed "sync_cross_faction_units"
          fi

          if echo "$FACTIONS" | grep -q "cleanup_wings_duplicates"; then
            run_seed apply_batch_fixes_apr2026ab
          fi

          if echo "$FACTIONS" | grep -q "delete_codex_units"; then
            run_seed delete_codex_units
          fi

          if echo "$FACTIONS" | grep -q "delete_legacy_guard_units"; then
            run_seed delete_legacy_guard_units
          fi

          if echo "$FACTIONS" | grep -q "assign_missing_skus"; then
            echo "========================================="
            echo "Running: assign_missing_skus"
            echo "========================================="
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              python manage.py assign_missing_skus
            else
              python manage.py assign_missing_skus --execute
            fi
          fi

          # Clear the Django cache so the live site reflects seeded changes
          # immediately, without waiting for the next Railway deploy.
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "========================================="
            echo "Running: clear_cache"
            echo "========================================="
            python manage.py clear_cache || true
          fi

          echo "All selected faction seeds complete."
