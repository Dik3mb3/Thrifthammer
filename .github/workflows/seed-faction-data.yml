name: Seed Faction Stat Data (Production)

# Run manually from GitHub Actions UI to populate unit stats,
# weapon profiles, and abilities into the Railway PostgreSQL database.
# Safe to re-run — all seed commands use update_or_create.

on:
  workflow_dispatch:
    inputs:
      factions:
        description: 'Which factions to seed (comma-separated: votann,admech,aeldari,guard,custodes,drukhari,grey_knights,necrons,orks,sisters_of_battle,tau,genestealer_cults,imperial_knights,blood_angels,space_wolves,dark_angels,deathwatch — or "all"). Maintenance: delete_codex_units, delete_legacy_guard_units, assign_missing_skus, sync_cross_faction_units'
        type: string
        default: 'all'
      dry_run:
        description: 'Dry run (preview changes, write nothing)'
        type: boolean
        default: false

jobs:
  seed:
    name: Seed faction data into production DB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed faction data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi

          FACTIONS="${{ github.event.inputs.factions }}"

          run_seed() {
            echo "========================================="
            echo "Running: $1"
            echo "========================================="
            python manage.py $1 $FLAGS
          }

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "votann"; then
            run_seed seed_votann_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "admech"; then
            run_seed seed_admech_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "aeldari"; then
            run_seed seed_aeldari_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "guard"; then
            run_seed seed_guard_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "custodes"; then
            run_seed seed_custodes_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "drukhari"; then
            run_seed seed_drukhari_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "grey_knights"; then
            run_seed seed_grey_knights_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "necrons"; then
            run_seed seed_necrons_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "aeldari"; then
            run_seed seed_aeldari_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "orks"; then
            run_seed seed_orks_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "sisters_of_battle"; then
            run_seed seed_sisters_of_battle_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "tau"; then
            run_seed seed_tau_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "genestealer_cults"; then
            run_seed seed_genestealer_cults_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "imperial_knights"; then
            run_seed seed_imperial_knights_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "blood_angels"; then
            run_seed seed_blood_angels_stats
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "space_wolves"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Space Wolves"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Space Wolves" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Space Wolves"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Space Wolves" \
              --json ../parser_output/spacewolves_parsed.json \
              --mapping ../parser_output/spacewolves_mapping.csv \
              $FLAGS
          fi
          
          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "dark_angels"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Dark Angels"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Dark Angels" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Dark Angels"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Dark Angels" \
              --json ../parser_output/dark_angels_parsed.json \
              --mapping ../parser_output/dark_angels_mapping.csv \
              $FLAGS
          fi

          if [ "$FACTIONS" = "all" ] || echo "$FACTIONS" | grep -q "deathwatch"; then
            echo "========================================="
            echo "Running: sync_cross_faction_units --faction Deathwatch"
            echo "========================================="
            python manage.py sync_cross_faction_units --faction "Deathwatch" $FLAGS
            echo "========================================="
            echo "Running: import_faction_stats --faction Deathwatch"
            echo "========================================="
            python manage.py import_faction_stats \
              --faction "Deathwatch" \
              --json ../parser_output/deathwatch_parsed.json \
              --mapping ../parser_output/deathwatch_mapping.csv \
              $FLAGS
          fi

          if echo "$FACTIONS" | grep -q "sync_cross_faction_units"; then
            run_seed "sync_cross_faction_units"
          fi

          if echo "$FACTIONS" | grep -q "delete_codex_units"; then
            run_seed delete_codex_units
          fi

          if echo "$FACTIONS" | grep -q "delete_legacy_guard_units"; then
            run_seed delete_legacy_guard_units
          fi

          if echo "$FACTIONS" | grep -q "assign_missing_skus"; then
            echo "========================================="
            echo "Running: assign_missing_skus"
            echo "========================================="
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              python manage.py assign_missing_skus
            else
              python manage.py assign_missing_skus --execute
            fi
          fi

          echo "All selected faction seeds complete."
