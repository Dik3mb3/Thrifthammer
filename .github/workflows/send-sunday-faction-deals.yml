name: Send Sunday Faction Deal Digest

on:
  schedule:
    # Every Sunday at 9:00 AM EST (14:00 UTC). Fixed UTC time all year;
    # daylight saving time is intentionally ignored.
    #
    # IMPORTANT: a scheduled run is an ADMIN REVIEW ONLY. It runs
    # review_sunday_faction_deals, which emails the admin one list of every
    # unique deal across all subscribers and can never email anyone else.
    # Review it, then trigger the real send yourself: Actions tab -> this
    # workflow -> "Run workflow" -> leave recipient blank -> Run workflow.
    - cron: '0 14 * * 0'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions tab (great for testing,
    # and this is also how you approve and send the real digest after
    # reviewing the scheduled preview -- leave recipient blank to send to
    # every subscriber).
    inputs:
      dry_run:
        description: 'Dry run (log recipients, send nothing)'
        type: boolean
        default: false
      limit:
        description: 'Number of top deals per subscriber to include (default: 10)'
        type: string
        default: '10'
      recipient:
        description: 'Send only to this address (leave blank for all subscribers)'
        type: string
        default: ''

jobs:
  send-email:
    name: Sunday Personalised Faction Deal Digest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send Sunday faction digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs only email the admin review -- never real
            # subscribers. Approve by running this workflow manually with
            # recipient blank.
            python manage.py review_sunday_faction_deals
            exit 0
          fi
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ -n "${{ github.event.inputs.recipient }}" ]; then
            FLAGS="$FLAGS --recipient ${{ github.event.inputs.recipient }}"
          fi
          python manage.py send_sunday_faction_deals $FLAGS
