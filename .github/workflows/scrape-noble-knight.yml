name: Scrape Noble Knight Games

on:
  schedule:
    # Every day at 05:30 UTC. Each run refreshes one seventh of the catalog (the
    # slice for today's weekday, about 300 products), so every product is visited
    # once a week and a run takes roughly 15 minutes instead of hours.
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      batch_tag:
        description: 'Only scrape products with this batch_tag (e.g. kill-team, blood-bowl)'
        type: string
        default: ''
      full_run:
        description: 'Visit every product instead of just today''s slice (slow, about 90 minutes)'
        type: boolean
        default: false

# Never run two Noble Knight scrapes at the same time.
concurrency:
  group: scrape-noble-knight
  cancel-in-progress: false

jobs:
  scrape:
    name: Noble Knight Scraper
    runs-on: ubuntu-latest
    # A daily slice finishes in about 15 minutes; 2h leaves room for a manual
    # full run (~2,100 products at ~2s each).
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Noble Knight scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.batch_tag }}" ]; then
            FLAGS="$FLAGS --batch-tag ${{ github.event.inputs.batch_tag }}"
          elif [ "${{ github.event.inputs.full_run }}" != "true" ]; then
            # Scheduled runs and plain manual runs: only today's slice.
            FLAGS="$FLAGS --shard $(date -u +%w)/7 --limit 500"
          fi
          python manage.py run_scrapers noble-knight-games $FLAGS

      # Runs even when the scrape stops early, because it may already have saved
      # some prices before it stopped.
      - name: Clear cache after price update
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
