name: Send Weekly Deal Digest

on:
  schedule:
    # Every Wednesday at 9:00 AM Eastern (13:00 UTC during EDT; adjust to
    # 14:00 UTC in winter when EST/UTC-5 kicks in) — well after the daily
    # scrapers have finished:
    #   eBay      03:00 UTC  (daily)
    #   Amazon    04:00 UTC  (daily)
    #   MM        04:00 UTC  (daily)
    #   --> email 13:00 UTC  (Wednesday) <-- all prices are fresh
    #
    # IMPORTANT: a scheduled run is a PREVIEW ONLY. It sends to
    # NEWSLETTER_PREVIEW_EMAIL, never to real subscribers, regardless of
    # what the recipient input below says -- see the run step. Review the
    # preview, then trigger a real send yourself: Actions tab -> this
    # workflow -> "Run workflow" -> leave recipient blank -> Run workflow.
    - cron: '0 13 * * 3'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions tab (great for testing,
    # and this is also how you approve and send the real digest after
    # reviewing the scheduled preview -- leave recipient blank to send to
    # every subscriber).
    inputs:
      dry_run:
        description: 'Dry run (log recipients, send nothing)'
        type: boolean
        default: false
      limit:
        description: 'Number of top deals to include (default: 10)'
        type: string
        default: '10'
      recipient:
        description: 'Send only to this address (leave blank for all subscribers)'
        type: string
        default: ''

jobs:
  send-email:
    name: Weekly Deal Digest Email
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly deal digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
          # Email credentials — set these in GitHub repo secrets
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: '587'
          EMAIL_USE_TLS: 'True'
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          NEWSLETTER_PREVIEW_EMAIL: ${{ secrets.NEWSLETTER_PREVIEW_EMAIL }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs are a preview only -- never auto-send to real
            # subscribers. Approve by re-running manually with recipient blank.
            FLAGS="$FLAGS --recipient $NEWSLETTER_PREVIEW_EMAIL"
          elif [ -n "${{ github.event.inputs.recipient }}" ]; then
            FLAGS="$FLAGS --recipient ${{ github.event.inputs.recipient }}"
          fi
          python manage.py send_weekly_deals $FLAGS
