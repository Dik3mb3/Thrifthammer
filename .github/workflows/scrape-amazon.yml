name: Scrape Amazon Prices

# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT: The scheduled cron trigger is intentionally DISABLED.
#
# Amazon blocks HTTP requests originating from AWS IP ranges (which is where
# GitHub Actions runners operate). Every scheduled run was silently failing —
# all 375 Amazon prices went stale because no price could ever be extracted.
#
# Amazon scraping MUST run from Railway directly (Google Cloud, not AWS).
# Set up a Railway Cron service in the Railway dashboard with:
#   Schedule: 0 4 * * *  (daily 04:00 UTC)
#   Command:  python manage.py run_scrapers amazon && python manage.py clear_cache
#
# This workflow is kept for manual testing only (workflow_dispatch).
# To test from here: run with a single product URL to verify selectors work.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'NOTE: Amazon scraping must run from Railway, not GitHub Actions (AWS IPs are blocked by Amazon). Use this only for debugging selector issues.'
        required: false
        default: ''

jobs:
  scrape:
    name: Amazon Price Scraper (manual/debug only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Warn about AWS IP blocking
        run: |
          echo "WARNING: This run is originating from GitHub Actions (AWS infrastructure)."
          echo "Amazon actively blocks AWS IP ranges. Price extraction will likely fail."
          echo "For production use, run from Railway Cron instead."

      - name: Run Amazon price scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py run_scrapers amazon

      - name: Clear cache after price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
