name: Update Amazon Prices (Keepa API)

# ─────────────────────────────────────────────────────────────────────────────
# Runs weekly on Thursday at 04:00 UTC.
#
# Uses the Keepa API (https://keepa.com) to fetch current Amazon prices — NOT
# direct Amazon scraping.  Direct scraping from any cloud server (AWS, GCP,
# Azure) is blocked by Amazon 100% of the time.  Keepa is a legitimate Amazon
# price tracking service with its own Amazon access; calling their API from
# GitHub Actions works reliably.
#
# FREE TIER SETUP (one-time, ~2 minutes):
#   1. Create a free account at https://keepa.com/#!api
#   2. Copy your API key from the dashboard
#   3. In this GitHub repo: Settings → Secrets and variables → Actions
#   4. Add secret: KEEPA_API_KEY = <your key>
#
# Free tier: 1000 tokens/day.  Each product costs 1 token.
# With ~375 products/week that's ~54/day — well within the free limit.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 4 * * 4'   # Thursday 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Set to "true" to preview without writing to DB'
        required: false
        default: 'false'

jobs:
  update-prices:
    name: Amazon Price Update via Keepa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Amazon prices via Keepa API
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY:     ${{ secrets.DJANGO_SECRET_KEY }}
          KEEPA_API_KEY:         ${{ secrets.KEEPA_API_KEY }}
          DJANGO_ALLOWED_HOSTS:  thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG:          'False'
          RAILWAY_ENVIRONMENT:   production
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python manage.py update_amazon_prices_keepa --dry-run
          else
            python manage.py update_amazon_prices_keepa
          fi

      - name: Clear cache after price update
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY:     ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS:  thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG:          'False'
          RAILWAY_ENVIRONMENT:   production
        run: python manage.py clear_cache
