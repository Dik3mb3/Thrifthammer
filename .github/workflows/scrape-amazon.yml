name: Scrape Amazon Prices

# ─────────────────────────────────────────────────────────────────────────────
# Runs weekly on Thursday at 04:00 UTC.
#
# Amazon blocks requests from AWS IP ranges (GitHub Actions), so this may
# have limited success. For best results, also run from Railway Cron:
#   Schedule: 0 4 * * 4  (Thursday 04:00 UTC)
#   Command:  python manage.py run_scrapers amazon && python manage.py clear_cache
#
# The scraper uses session rotation and browser fingerprint diversity to
# reduce bot-detection signals. Weekly frequency also helps — fewer requests
# means a lower traffic footprint.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 4 * * 4'   # Thursday 04:00 UTC
  workflow_dispatch:
    inputs:
      note:
        description: 'Manual run. Amazon may block AWS IPs — use Railway Cron for reliability.'
        required: false
        default: ''

jobs:
  scrape:
    name: Amazon Price Scraper (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Amazon price scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py run_scrapers amazon

      - name: Clear cache after price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
