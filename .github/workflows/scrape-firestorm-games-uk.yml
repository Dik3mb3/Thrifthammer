name: Scrape Firestorm Games UK

on:
  # The weekly schedule is switched off on purpose. Firestorm's Cloudflare turns
  # away GitHub-hosted runners: every scheduled run from 2026-08-29 to 2026-10-02
  # failed every row and then sat until the timeout (about 1,190 blocked
  # requests per run, zero prices updated). Run Firestorm by hand from a normal
  # connection instead, in slices:
  #     python manage.py run_scrapers firestorm-games --shard 3/7 --limit 500
  # The old schedule was:  cron '0 16 * * 5'  (Fridays 16:00 UTC)
  workflow_dispatch:
    inputs:
      batch_tag:
        description: 'Only scrape products with this batch_tag (e.g. old-world, kill-team)'
        type: string
        default: ''

jobs:
  scrape:
    name: Firestorm Games UK Scraper
    runs-on: ubuntu-latest
    # ~2,150 products, ~2s/item (polite delay + jitter, mirrors Noble Knight's
    # Cloudflare-safe pacing) -> ~90 min in the typical case. Sized generously
    # since this only runs once a week -- no reason to rush requests and risk
    # a Cloudflare block just to fit a tighter window.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Firestorm Games UK scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.batch_tag }}" ]; then
            FLAGS="$FLAGS --batch-tag ${{ github.event.inputs.batch_tag }}"
          fi
          python manage.py run_scrapers firestorm-games $FLAGS

      - name: Clear cache after price update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
