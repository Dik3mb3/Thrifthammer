name: Scrape Miniature Market

on:
  schedule:
    # Every day at 04:00 UTC. Each run refreshes one seventh of the stored
    # Miniature Market links (the slice for today's weekday, about 285 rows):
    # it only updates prices and stock, never changes a link, never blanks a
    # price and never marks a product unavailable. If the site blocks the run,
    # nothing is changed and the run fails so GitHub emails you.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      batch_tag:
        description: 'Only scrape products with this batch_tag (e.g. blood-bowl); runs the full search-based pass for that tag'
        type: string
        default: ''
      full_run:
        description: 'Run the full search-based pass over every product (slow, finds new listings, about 3 hours)'
        type: boolean
        default: false

# Never run two Miniature Market scrapes at the same time.
concurrency:
  group: scrape-miniature-market
  cancel-in-progress: false

jobs:
  scrape:
    name: Miniature Market Scraper
    runs-on: ubuntu-latest
    # A daily slice finishes in about 15 minutes. A manual full pass walks every
    # active product (~3,400) and is cut off by this limit.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ./Thrifthammer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Thrifthammer/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Miniature Market scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.batch_tag }}" ]; then
            FLAGS="$FLAGS --batch-tag ${{ github.event.inputs.batch_tag }}"
          elif [ "${{ github.event.inputs.full_run }}" != "true" ]; then
            # Scheduled runs and plain manual runs: only today's slice.
            FLAGS="$FLAGS --shard $(date -u +%w)/7 --limit 500"
          fi
          python manage.py run_scrapers miniature-market $FLAGS

      # Runs even when the scrape stops early, because it may already have saved
      # some prices before it stopped.
      - name: Clear cache after price update
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: thrifthammer.com,www.thrifthammer.com,web-production-b6056.up.railway.app
          DJANGO_DEBUG: 'False'
          RAILWAY_ENVIRONMENT: production
        run: python manage.py clear_cache
