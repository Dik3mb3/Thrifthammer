{% extends "base.html" %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block title %}Change Password | ThriftHammer{% endblock %}

{% block content %}
<div class="auth-form">
    <h1>Change Password</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Change Password</button>
    </form>
</div>
{% endblock %}
