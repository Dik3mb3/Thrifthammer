[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate && python manage.py createcachetable --no-color || true && python manage.py collectstatic --noinput && python manage.py populate_products --skip-if-current && python manage.py populate_units --skip-if-current && python manage.py seed_all --skip-products --skip-units && python manage.py seed_blog && python manage.py publish_roadmap_post && python manage.py stamp_price_date 2026-03-17 && gunicorn thrifthammer.wsgi --bind 0.0.0.0:$PORT"

# ── Scheduled price refresh jobs ──────────────────────────────────────────────
# eBay: daily at 03:00 UTC (~375 API calls, ~6 min)
[crons.update-ebay-prices]
command = "python manage.py update_ebay_prices"
schedule = "0 3 * * *"

# Miniature Market: weekly on Monday at 04:00 UTC (HTML scraper, ~2 min)
[crons.scrape-miniature-market]
command = "python manage.py run_scrapers miniature-market"
schedule = "0 4 * * 1"

# Amazon stock check: weekly on Monday at 05:00 UTC (~2 min, 50 listings × 0.8s)
[crons.check-amazon-stock]
command = "python manage.py check_amazon_stock --delay 0.8"
schedule = "0 5 * * 1"
